{{ define "main" }}
<h1 class="title">posts</h1>
<img class="hero" src="/pics/snowy.webp" alt="Snowy plover between stone walls" width="1200" height="265">
<table class="listing">
  {{ range (where site.RegularPages "Section" "posts").ByDate.Reverse }}
  <tr>
    <td class="date">{{ .Date.Format "2006-01-02" }}</td>
    <td><a href="{{ .RelPermalink }}">{{ .Title }}</a></td>
  </tr>
  {{ end }}
</table>
{{ end }}
