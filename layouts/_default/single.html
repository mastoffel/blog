{{ define "main" }}
<header class="title-block">
  <h1 class="title">{{ .Title }}</h1>
  {{ with .Description }}<p class="description">{{ . }}</p>{{ end }}
  {{ if eq .Section "posts" }}<div class="meta"><div class="meta-heading">Published</div><p>{{ .Date.Format "January 2, 2006" }}</p></div>{{ end }}
</header>
{{ .Content }}
{{ end }}
