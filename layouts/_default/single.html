{{ define "main" }}
<article>
  <h1>{{ .Title }}</h1>
  {{ if eq .Section "posts" }}<p class="byline">{{ with .Description }}{{ . }} | {{ end }}<time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 January 2006" }}</time></p>{{ end }}
  {{ .Content }}
  {{ with .Params.links }}<p class="links">{{ range $i, $l := . }}{{ if $i }} | {{ end }}<a href="{{ index $l 1 }}">{{ index $l 0 }}</a>{{ end }}</p>{{ end }}
</article>
{{ end }}
