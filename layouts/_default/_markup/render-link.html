{{- $nut := hasPrefix .Destination "#x-" -}}

<a href="{{ .Destination | safeURL }}"{{ with .Title }} title="{{ . }}"{{ end }}{{ if $nut }} class="nut"{{ end }}>{{ strings.TrimPrefix ":" .Text | safeHTML }}</a>
{{- /* chomp trailing newline */ -}}
