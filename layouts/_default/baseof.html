<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
<link rel="icon" href="/favicon.png">
{{ with resources.Get "css/main.css" | minify | fingerprint }}<link rel="stylesheet" href="{{ .RelPermalink }}">{{ end }}
<script async src="https://www.googletagmanager.com/gtag/js?id=G-FYLF41PFGT"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','G-FYLF41PFGT');</script>
</head>
<body>
<header class="masthead">
  <a class="name" href="/">Martin Stoffel</a>
  <nav>
    {{ $here := .RelPermalink }}
    {{ range slice (slice "writing" "/") (slice "projects" "/projects/") (slice "about" "/about/") }}
    <a href="{{ index . 1 }}"{{ if eq $here (index . 1) }} aria-current="page"{{ end }}>{{ index . 0 }}</a>
    {{ end }}
  </nav>
</header>
<main>{{ block "main" . }}{{ end }}</main>
<script src="/nutshell.js" defer></script>
<script src="/phylo-trail.js" defer></script>
</body>
</html>
