[build]
command = "hugo --gc --minify"
publish = "public"

[build.environment]
HUGO_VERSION = "0.168.0"

# CSS filenames are content-hashed, fonts never change: cache for a year.
[[headers]]
for = "/css/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
for = "/fonts/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"
# Images and scripts: a week, refreshed in the background.
[[headers]]
for = "/pics/*"
[headers.values]
Cache-Control = "public, max-age=604800, stale-while-revalidate=604800"
[[headers]]
for = "/*.js"
[headers.values]
Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
